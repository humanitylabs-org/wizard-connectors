# Publishes the Connected accounts image (multi-arch, tag sha-<commit>) with the shared App Index workflow.
# Pin the digest it prints in runtipi/docker-compose.yml.
name: app-image
on:
  push:
    branches: [release/standard-0.2.0]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  image:
    uses: humanitylabs-org/wizard-app-index/.github/workflows/app-image.yml@main
    with:
      dockerfile: app/Dockerfile
