<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Connected accounts</title>
  <script src="boot.js"></script>
  <link rel="stylesheet" href="wizard-ui.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="/wizard-os-home/core/app-client.js"></script>
  <script defer src="app.js"></script>
</head>
<body data-view="loading">
  <div class="wz-app">
    <!-- Shown only standalone; in a shell window the title bar already names the app. -->
    <header class="wz-head"><h1>Connected accounts</h1></header>
    <main id="view" class="wz-scroll">
      <div class="ca-state" role="status"><strong>Loading…</strong></div>
    </main>
    <p id="status" class="wz-sr" role="status" aria-live="polite"></p>
    <footer id="dock" class="ca-dock" hidden></footer>
  </div>
  <dialog id="dialog" class="ca-sheet" aria-labelledby="dialog-title" aria-describedby="dialog-text">
    <h2 id="dialog-title"></h2>
    <p id="dialog-text"></p>
    <div id="dialog-actions" class="ca-sheet-actions"></div>
  </dialog>
</body>
</html>
