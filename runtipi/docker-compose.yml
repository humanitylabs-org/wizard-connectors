services:
  wizard-connectors:
    image: ${CONNECTORS_IMAGE:?Pin reviewed image}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    tmpfs: [/tmp]
    environment:
      PORT: "8799"
      DATA_DIR: /data
      CONNECTORS_OWNER_TOKEN: ${CONNECTORS_OWNER_TOKEN:?Required}
      CONNECTORS_MCP_TOKEN: ${CONNECTORS_MCP_TOKEN:?Required}
      TINFOIL_API_KEY: ${TINFOIL_API_KEY:-}
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-localhost,127.0.0.1}
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    x-runtipi:
      is_main: true
      internal_port: 8799
x-runtipi:
  schema_version: 2
  overrides: []
